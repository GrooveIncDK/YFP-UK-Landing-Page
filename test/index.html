<script>
(function(){
  var phone = document.getElementById('phone');
  var screens = {};
  [].forEach.call(document.querySelectorAll('.screen'), function(s){ screens[s.id] = s; });
  var order = Object.keys(screens);
  var current = null;

  // Fit the 428x926 design to the window (full width on phones, whole phone visible on desktop)
  function fit(){
    var w = window.innerWidth, h = window.innerHeight, s;
    if (w <= 500) { s = w / 428; phone.style.transform = 'scale(' + s + ')';
      document.body.style.height = (926 * s) + 'px'; document.body.style.overflow = 'auto'; }
    else { s = Math.min(1, (h - 24) / 926, (w - 24) / 428); phone.style.transform = 'scale(' + s + ')';
      document.body.style.height = ''; document.body.style.overflow = 'hidden'; }
  }
  window.addEventListener('resize', fit); fit();

  // Images load only when their screen is shown (low-bandwidth), neighbours preload when idle
  function loadImages(id){
    var s = screens[id]; if (!s || s.dataset.loaded) return;
    [].forEach.call(s.querySelectorAll('image[data-src]'), function(im){
      im.setAttribute('href', im.getAttribute('data-src'));
    });
    s.dataset.loaded = '1';
  }
  function linksFrom(id){
    var out = [];
    [].forEach.call(screens[id].querySelectorAll('[data-go]'), function(e){
      var d = e.getAttribute('data-go'); if (out.indexOf(d) < 0) out.push(d); });
    return out;
  }
  function preloadNext(id){
    var idle = window.requestIdleCallback || function(f){ return setTimeout(f, 600); };
    idle(function(){ linksFrom(id).forEach(loadImages); });
  }

  function show(id, fade, push){
    if (!screens[id]) id = 'sign-in-page';
    if (current === id) return;
    if (current) screens[current].classList.remove('on', 'fade');
    loadImages(id);
    var s = screens[id];
    s.classList.add('on'); if (fade) s.classList.add('fade');
    current = id;
    if (push !== false) history.pushState({id: id}, '', '#' + id);
    preloadNext(id);
  }
  window.addEventListener('popstate', function(e){ show((e.state && e.state.id) || location.hash.slice(1), false, false); });

  function activate(el){
    if (el.hasAttribute('data-go')) show(el.getAttribute('data-go'), el.hasAttribute('data-fade'));
    else if (el.hasAttribute('data-top')) { window.scrollTo(0, 0); }
  }
  phone.addEventListener('click', function(e){
    var el = e.target.closest('.hot');
    if (!el) { // a label drawn on top of a link area (e.g. "Exit" over its button) still triggers that link
      var stack = document.elementsFromPoint(e.clientX, e.clientY);
      for (var i = 0; i < stack.length && !el; i++) el = stack[i].closest && stack[i].closest('.hot');
    }
    if (el) activate(el);
  });
  phone.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('hot')) {
      e.preventDefault(); activate(e.target); }
  });

  // Swipe right where XD defines a drag interaction (District Questions -> Farmer Questions)
  var sx = null, sy = null;
  phone.addEventListener('pointerdown', function(e){ sx = e.clientX; sy = e.clientY; });
  phone.addEventListener('pointerup', function(e){
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    var to = screens[current].getAttribute('data-swipe');
    if (to && dx > 70 && Math.abs(dy) < 50) show(to, true);
  });

  show(location.hash.slice(1) || 'sign-in-page', false, false);
  history.replaceState({id: current}, '', '#' + current);
})();
</script>
